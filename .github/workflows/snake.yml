name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#8A5C2C&color_dots=#ebe5d9,#e6cfae,#d39b5f,#b5844f,#8a5c2c
            dist/snake-dark.svg?palette=github-dark&color_snake=#D39B5F&color_dots=#1d1f26,#3a2e22,#6b4a2b,#b5844f,#d39b5f
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
